<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm Quốc phòng</title><meta name="color-scheme" content="dark">
<style>
:root{--bg:#1c1118;--card:#2a1a23;--tx:#f8e9f0;--mu:#c9a6b7;--pr:#d6547f;--ln:#4d3040;--ok:#5fd39a;--no:#ff7a8c;--gd:#f4a9c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1118;--card:#2a1a23;--tx:#f8e9f0;--mu:#c9a6b7;--pr:#d6547f;--ln:#4d3040;--ok:#5fd39a;--no:#ff7a8c;--gd:#f4a9c4;}}
:root[data-theme="dark"]{--bg:#1c1118;--card:#2a1a23;--tx:#f8e9f0;--mu:#c9a6b7;--pr:#d6547f;--ln:#4d3040;--ok:#5fd39a;--no:#ff7a8c;--gd:#f4a9c4;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px;padding:12px 14px;background:linear-gradient(135deg,#b23a63,#e8709a);color:#fff;border-radius:12px;border-bottom:4px solid var(--gd);letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--ln);border-top:3px solid var(--gd);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px #0000000d}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--gd));transition:width .2s}
.mu{color:var(--mu);font-size:14px}
.q{font-size:18px;font-weight:600;margin:6px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:14px;margin-bottom:10px;border:2px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt b{min-width:22px}.opt:hover{border-color:var(--pr)}.opt.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,var(--card))}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.btn{padding:12px 18px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn:disabled{opacity:.4;cursor:default}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.nav button{padding:9px 0;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.nav .done{background:color-mix(in srgb,var(--pr) 18%,var(--card));border-color:var(--pr)}.nav .cur{outline:2px solid var(--pr);outline-offset:1px;font-weight:700}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:380px;margin:0}
.sum{font-size:22px;font-weight:700;margin:6px 0}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stats div{flex:1;min-width:100px;padding:12px;border-radius:10px;background:var(--bg);text-align:center}.stats b{display:block;font-size:22px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#1c1118}.tag.ok{background:var(--ok)}.tag.no{background:var(--no)}
.rv{border-left:5px solid var(--ln)}.rv.ok{border-left-color:var(--ok)}.rv.no{border-left-color:var(--no)}
.ans{margin:4px 0;font-size:15px}.ans.c{color:var(--ok);font-weight:600}.ans.w{color:var(--no);font-weight:600}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.flt button{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}.flt .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.hide{display:none}
</style></head><body><div class="w">
<h1>Trắc nghiệm ôn tập Quốc phòng – An ninh</h1>
<div class="flt" id="dets"><button data-d="1" class="on">Đề 1</button><button data-d="2">Đề 2</button><button data-d="3">Đề 3</button><button data-d="4">Đề 4</button></div>
<div class="flt" id="sets"><button data-s="1" class="on">Câu 1–50</button><button data-s="2">Câu 51–100</button></div>
<div class="flt"><button id="shf">🔀 Đảo ngẫu nhiên câu hỏi (đề đang chọn)</button><button id="ord">↩ Về thứ tự gốc</button></div>
<div id="quiz">
 <div class="card"><div class="row mu"><span id="pt"></span><span id="ac"></span></div><div class="bar"><i id="pb"></i></div>
  <div class="mu" id="qn"></div><div class="q" id="qt"></div><div id="op"></div>
  <div class="row"><button class="btn g" id="pv">← Câu trước</button><button class="btn" id="nx">Câu sau →</button></div></div>
 <div class="card"><div class="mu" style="margin-bottom:8px">Danh sách câu hỏi (ô tô màu = đã trả lời)</div><div class="nav" id="nv"></div>
  <div style="margin-top:14px"><button class="btn" id="sb" style="width:100%">Nộp bài</button></div></div>
</div>
<div id="res" class="hide">
 <div class="card"><div class="mu">Kết quả</div><div class="sum" id="sm"></div>
  <div class="stats"><div><b id="st"></b>Tổng số câu</div><div><b id="sc" style="color:var(--ok)"></b>Đúng</div><div><b id="sw" style="color:var(--no)"></b>Sai</div><div><b id="sp"></b>Điểm</div></div>
  <div style="margin-top:14px"><button class="btn" id="rt">Làm lại (xáo trộn)</button></div></div>
 <div class="flt" id="fl"><button data-f="all" class="on">Tất cả</button><button data-f="ok">Câu đúng</button><button data-f="no">Câu sai</button></div>
 <div id="rv"></div>
</div>
<div id="md" class="modal hide"><div class="card"><div class="q" id="mt"></div><div class="row"><button class="btn g" id="mc">Quay lại</button><button class="btn" id="my">Nộp bài</button></div></div></div>
</div>
<script>
// [câu hỏi, A, B, C, D, đáp án đúng (0=A,1=B,2=C,3=D)] — đáp án lấy theo dấu gạch chân trong đề
const RAW=[
["Một trong những phương hướng cơ bản XDLLVT nhân dân trong giai đoạn mới là gì ?","Xây dựng lực lượng vũ trang nhân dân vững mạnh.","Xây dựng lực lượng dự bị động viên hùng hậu, được huấn luyện và quản lý tốt, bảo đảm khi cần thiết có thể động viên nhanh chóng theo kế hoạch.","Xây dựng lực lượng dân quân du kích, đặt dưới sự lãnh đạo của Đảng.","Xây dựng lực lượng du kích hùng hậu.",1],
["Đâu là phương hướng cơ bản XDLLVT nhân dân trong giai đoạn mới?","Xây dựng lực lượng vũ trang nhân dân vững mạnh đặt dưới sự lãnh đạo của Đảng.","Xây dựng lực lượng vũ trang nhân dân lấy chất lượng là chính, lấy xây dựng chính trị làm cơ sở.","Xây dựng lực lượng dân quân du kích, vững mạnh đặt dưới sự lãnh đạo của Đảng.","Cả ba ý trên.",1],
["Một trong những quan điểm, nguyên tắc cơ bản xây dựng LL vũ trang nhân dân là gì?","Xây dựng lực lượng vũ trang nhân dân có khả năng thích ứng với chiến tranh hiện đại.","Xây dựng lực lượng vũ trang nhân dân có khả năng tác chiến tốt, vũ khí trang bị hiện đại.","Xây dựng lực lượng vũ trang nhân dân có kỷ luật nghiêm, có sức mạnh chiến đấu tốt trong mọi điều kiện.","Đảm bảo cho LLVT nhân dân luôn trong tư thế sẵn sàng chiến đấu và chiến đấu thắng lợi.",3],
["Vì sao lực lượng vũ trang nhân dân phải luôn trong tư thế sẵn sàng chiến đấu?","Đây là quan điểm phản ánh chức năng, nhiệm vụ chủ yếu cơ bản, thường xuyên của LLVT ND.","Đây là nhiệm vụ thường xuyên, cơ bản trước mắt của lực lượng vũ trang nhân dân.","Đây là yêu cầu của thời kỳ công nghiệp hóa, hiện đại hóa đất nước.","Đây là nhiệm vụ cơ bản lâu dài của lực lượng vũ trang nhân dân Việt Nam.",0],
["Tinh nhuệ về chính trị được thể hiện như thế nào?","Đứng trước tình hình chính trị phức tạp trên thế giới phải biết phân biệt địch ta.","Đứng trước diễn biến của tình hình, có khả năng phân tích và kết luận chính xác đúng, sai từ đó có thái độ đúng đắn với sự việc đó.","Nắm bắt kịp thời tình hình trong nước và quốc tế.","Kiên quyết đấu tranh với các hiện tượng tiêu cực trong xã hội.",1],
["Thực trạng về chính trị của lực lượng vũ trang nhân dân ta như thế nào?","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của cán bộ, chiến sĩ ta rất tốt, sẵn sàng chiến đấu chống mọi kẻ thù.","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của không ít cán bộ, chiến sĩ ta chưa tương xứng với vị trí, yêu cầu, nhiệm vụ của LLVT.","Cán bộ, chiến sĩ ta có trình độ lí luận, tính nhạy bén, sắc sảo, sẵn sàng chiến đấu chống mọi kẻ thù xâm lược.","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của cán bộ, chiến sĩ ta còn yếu kém chưa tương xứng với vị trí, yêu cầu, nhiệm vụ của LLVT.",1],
["Thực trạng về trang bị của lực lượng vũ trang nhân dân ta như thế nào?","Trang bị của lực lượng vũ trang hiện đại và đồng bộ.","Trang bị của lực lượng vũ trang còn lạc hậu và thiếu đồng bộ.","Trang bị của lực lượng vũ trang hiện nay nhiều nhưng chưa đồng bộ.","Trang bị của lực lượng vũ trang số lượng còn ít chưa đáp ứng cho chiến tranh hiện đại.",1],
["Một trong những thực trạng của lực lượng vũ trang nhân dân ta là gì?","Có khả năng chiến đấu và cơ động nhanh trên các loại địa hình còn hạn chế.","Khả năng chiến đấu và trình độ sẵn sàng chiến đấu của LLVT nhân dân còn có những mặt hạn chế.","Khả năng chiến đấu ở địa hình rừng núi của LL vũ trang nhân dân còn có mặt hạn chế.","Khả năng chiến đấu ở địa hình đồng bằng của lực LL VT nhân dân còn có mặt hạn chế.",1],
["Một trong những thực trạng của lực lượng vũ trang nhân dân ta là gì?","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của một số cán bộ, chiến sĩ ta chưa đáp ứng tình hình mới.","Trên thực tế, trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của không ít cán bộ, chiến sĩ ta chưa tương xứng với vị trí, yêu cầu, nhiệm vụ của LLVT trong cuộc đấu tranh bảo vệ Tổ quốc XHCN.","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của cán bộ Đảng viên có lúc còn hạn chế.","Trình độ lí luận, tính nhạy bén, sắc sảo và bản lĩnh chính trị của một bộ phận Đảng viên chuyển biến chậm.",1],
["Một trong những nội dung xây dựng quân đội theo hướng cách mạng là gì?","Có tinh thần đoàn kết quân dân, đoàn kết nội bộ tốt.","Có tinh thần đoàn kết quân dân, đoàn kết nội bộ, dân chủ rộng rãi.","Có tinh thần đoàn kết quân dân, đoàn kết nội bộ, đoàn kết quốc tế tốt.","Có tinh thần đoàn kết quân dân, đoàn kết nội bộ, tự giác nghiêm minh.",2],
["Phương hướng xây dựng LLVT nhân dân trong thời kỳ mới là gì?","Xây dựng QĐ, CAND theo hướng cách mạng, chính quy, tinh nhuệ, từng bước hiện đại.","Xây dựng lực lượng dự bị động viên hùng hậu, được huấn luyện và quản lý tốt, bảo đảm khi cần thiết có thể động viên nhanh chóng theo kế hoạch.","Xây dựng lực lượng dân quân tự vệ vững mạnh rộng khắp, lấy chất lượng là chính.","Cả 3 phương án trên.",3],
["Dựa trên cơ sở nào để thực hiện kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh?","Mối quan hệ kinh tế với quốc phòng, an ninh.","Nhiệm vụ phát triển kinh tế - xã hội và nhiệm vụ quốc phòng, an ninh.","Cơ sở lý luận và thực tiễn của sự kết hợp.","Hai nhiệm vụ chiến lược xây dựng và bảo vệ Tổ quốc.",2],
["Hiện nay để thực hiện thắng lợi hai nhiệm vụ chiến lược Đảng ta xác định như thế nào?","Phải thực hiện đồng thời hai nhiệm vụ chiến lược xây dựng và bảo vệ.","Phải kết hợp chặt chẽ giữa phát triển kinh tế với phát triển quốc phòng, an ninh.","Phải kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh.","Phải tăng cường quốc phòng, an ninh gắn với phát triển kinh tế - xã hội.",2],
["Vai trò của kinh tế đối với QP, AN như thế nào?","Kinh tế quyết định sự lớn mạnh và phát triển của QP, AN.","Kinh tế quyết định đến nguồn gốc ra đời, sức mạnh của QP, AN.","Kinh tế quyết định đến sự tồn tại và phát triển lâu dài của QP, AN.","Kinh tế quyết định đến việc biên chế trang bị vũ khí, phương tiện cho quốc phòng, an ninh.",1],
["Bản chất của chế độ kinh tế - xã hội quyết định như thế nào đối với quốc phòng, an ninh?","Quyết định bản chất của nền quốc phòng.","Quyết định đến bản chất của quân đội và công an.","Quyết định đến bản chất của quốc phòng, an ninh.","Quyết định nguồn gốc ra đời và bản chất của quốc phòng, an ninh.",2],
["Thực hiện kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh hiện nay, cả nước ta được chia thành mấy vùng kinh tế trọng điểm?","Chia thành 6 vùng kinh tế trọng điểm.","Chia thành 4 vùng kinh tế trọng điểm.","Chia thành 3 vùng kinh tế trọng điểm.","Chia thành 5 vùng kinh tế trọng điểm.",2],
["Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng - an ninh trong xác định chiến lược phát triển kinh tế - xã hội được thể hiện như thế nào?","Theo kế hoạch thống nhất từ trung ương đến địa phương.","Ngay trong việc xây dựng chiến lược phát triển kinh tế của quốc gia.","Theo chiến lược phát triển nền kinh tế đất nước.","Ngay trong chiến lược phát triển kinh tế và chiến lược phòng thủ quốc gia.",1],
["Một trong những nội dung chính kết hợp kinh tế - QP, an ninh đối với vùng biên giới là gì?","Tập trung trước hết vào xây dựng hoàn thiện chiến lược phát triển kinh tế XD thế trận QP, an ninh.","Nhà nước phải có cơ chế chính sách thỏa đáng động viên, khích lệ dân bám trụ biên giới sinh sống, làm ăn.","Tập trung xây dựng các xã trọng điểm về kinh tế và quốc phòng, an ninh. Trước hết, cần tập trung xây dựng phát triển hệ thống hạ tầng cơ sở.","Chú trọng đầu tư phát triển kinh tế - xã hội với xây dựng lực lượng vũ trang vững mạnh.",2],
["Đối với vùng biển đảo nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh cần chú ý vấn đề gì ?","Phải quan tâm đến đầu tư phát triển kinh tế, củng cố quốc phòng, an ninh ở các vùng ven biển và các đảo.","Tập trung xây dựng các xã trọng điểm về kinh tế và quốc phòng, an ninh dọc theo bờ biển và trên các đảo.","Phải tổ chức tốt việc định canh, định cư và có chính sách phù hợp đặc biệt đối với các đảo.","Nhà nước phải có cơ chế chính sách thoả đáng động viên khích lệ dân ra đảo bám trụ làm ăn lâu dài.",3],
["Trong nội dung kết hợp kinh tế - xã hội với QP,AN hiện nay cần phát triển công nghiệp quốc gia theo hướng nào?","Ưu tiên đầu tư phát triển công nghiệp nặng một cách hợp lý.","Phát triển theo hướng mỗi nhà máy, xí nghiệp vừa có thể sản xuất hàng dân dụng vừa có thể sản xuất hàng quân sự.","Phát triển theo hướng mỗi nhà máy, xí nghiệp, cần lựa chọn SX các sản phẩm phù hợp.","Phát triển công nghiệp quốc gia theo hướng chuyên sâu trên một số lĩnh vực mũi nhọn.",1],
["Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong các ngành, các lĩnh vực kinh tế chủ yếu nào?","Kết hợp trong công nghiệp.","Kết hợp trong nông, lâm, ngư nghiệp.","Kết hợp trong giao thông vận tải, bưu điện, y tế, khoa học-công nghệ, giáo dục và xây dựng cơ bản.","Cả ba nội dung trên.",3],
["Giải pháp: Bồi dưỡng nâng cao kiến thức, kinh nghiệm kết hợp phát triển kinh tế-xã hội với tăng cường củng cố quốc phòng, an ninh cho các đối tượng, cần tập trung gì?","Đối tượng bồi dưỡng.","Nội dung bồi dưỡng.","Hình thức bồi dưỡng.","Cả ba giải pháp trên.",3],
["Một trong những nội dung kết hợp phát triển kinh tế – xã hội với tăng cường củng cố quốc phòng, an ninh trong nông, lâm, ngư nghiệp là gì?","Phát triển đa dạng các loại hình dịch vụ trong nông lâm ngư nghiệp.","Đầu tư xây dựng phát triển cơ sở hạ tầng phục vụ đắc lực cho CNH, HĐH nông nghiệp, nông thôn.","Kết hợp nhằm khai thác có hiệu quả tiềm năng đất, rừng, biển, đảo và lực lượng lao động để phát triển đa dạng các ngành trong nông, lâm, ngư nghiệp.","Kết hợp phải nhằm đưa nông, lâm, ngư nghiệp phát triển theo hướng công nghiệp hoá, hiện đại hoá.",2],
["Nội dung kết hợp phát triển kinh tế – xã hội với tăng cường củng cố quốc phòng, an ninh trong nông nghiệp nhằm bảo đảm vấn đề gì?","Bảo đảm nhu cầu lương thực, thực phẩm nguyên liệu cho sản xuất và tiêu dùng của xã hội.","Bảo đảm an ninh lương thực và an ninh nông thôn góp phần tạo thế trận phòng thủ, “thế trận lòng dân” vững chắc.","Bảo đảm thắng lợi cho công cuộc CNH, HĐH nông nghiệp, nông thôn hiện nay.","Nhằm đảm bảo nhu cầu tiêu dùng trong nước và nhu cầu xuất khẩu ngày càng tăng.",1],
["Nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong nông lâm ngư nghiệp cần gắn với vấn đề gì ?","Gắn với việc giải quyết tốt các với các vấn đề xã hội như xoá đói giảm nghèo, nâng cao dân trí, chăm sóc sức khoẻ, đền ơn đáp nghĩa, nâng cao đời sống vật chất, tinh thần cho nhân dân, xây dựng nông thôn văn minh và hiện đại.","Gắn với việc xây dựng cơ sở hạ tầng như điện, đường, trường, trạm.","Gắn với việc xây dựng quy hoạch, kế hoạch thực hiện CNH, HĐH nông nghiệp, nông thôn.","Gắn với việc động viên, khuyến khích nhân dân thực hiện kết hợp Nhà nước và nhân dân cùng làm.",0],
["Một trong những nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong giao thông vận tải là gì?","Xây dựng hệ thống giao thông vận tải đáp ứng nhu cầu phát triển kinh tế - xã hội, quốc phòng - an ninh.","Trong xây dựng mạng lưới đường bộ phải tính toán đến nhu cầu của quốc phòng - an ninh.","Xây dựng kế hoạch động viên giao thông vận tải cho thời chiến.","Cần chú trọng mở rộng nâng cấp các tuyến đường, hệ thống sân bay, bến cảng phục vụ cả thời bình và thời chiến.",2],
["Để kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh thì trong XD cơ bản khi cấp phép đầu tư XD cho các đối tác nước ngoài cần đảm bảo yêu cầu nào?","Phải được chính phủ thẩm định phê duyệt cấp phép.","Phải có sự tham gia ý kiến của cơ quan quân sự có thẩm quyền.","Phải thành lập Hội đồng thẩm định có đầy đủ các bộ ngành liên quan.","Đối tác nước ngoài phải trình dự án với Hội đồng đảm bảo các yêu cầu của Chính phủ QĐ.",1],
["Vị trí vai trò của khoa học và công nghệ, giáo dục đối với sự phát triển đất nước là gì?","Là chiến lược, sách lược hàng đầu đối với sự phát triển của quốc gia.","Là động lực quan trọng thúc đẩy sự phát triển của quốc gia.","Là những yếu tố có vai trò quyết định đến sự phát triển của quốc gia.","Đóng vai trò là nền tảng, động lực, là quốc sách hàng đầu đối với sự phát triển của quốc gia.",3],
["Kết hợp phát triển kinh tế - xã hội với quốc phòng, an ninh trong lĩnh vực khoa học và công nghệ, giáo dục cần tập trung nội dung nào?","Cần ưu tiên đầu tư phát triển khoa học và công nghệ phục vụ cho nhu cầu QP, AN.","Nghiên cứu ban hành chính sách khuyến khích các tổ chức cá nhân có đề tài khoa học, dự án công nghệ và sản xuất các sản phẩm có ý nghĩa.","Nhà nước cần có chính sách đầu tư thích đáng cho các dự án các đề tài.","Cần có chiến lược phát triển khoa học và công nghệ giáo dục đáp ứng nhu cầu công nghiệp hoá, HĐH đất nước.",1],
["Kết hợp phát triển kinh tế – xã hội với tăng cường củng cố QP, AN trong lĩnh vực y tế cần chú ý nội dung nào?","Phát huy vai trò y tế dân sự, sẵn sàng động viên khi có chiến tranh.","Cần có chiến lược đào tạo nguồn nhân lực đáp ứng nhu cầu xã hội và quốc phòng, an ninh.","Phát huy vai trò quân, dân y trên cả nước đặc biệt là các địa bàn chiến lược.","Xây dựng kế hoạch động viên y tế dân sự cho quân sự khi có chiến tranh xảy ra.",3],
["Một trong những nội dung kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong thực hiện nhiệm vụ chiến lược bảo vệ Tổ quốc là gì?","Tổ chức biên chế, bố trí LLVT phải phù hợp với điều kiện kinh tế và nhu cầu phòng thủ đất nước.","Xây dựng lực lượng vũ trang chính quy, tinh nhuệ, từng bước hiện đại đáp ứng nhu cầu bảo vệ Tổ quốc.","Cần có chiến lược đào tạo, bồi dưỡng nguồn nhân lực đáp ứng nhiệm vụ xây dựng và bảo vệ Tổ quốc.","Phát huy tốt vai trò tham mưu của các cơ quan quân sự, công an trong XD chiến lược phòng thủ đất nước.",0],
["Kết hợp phát triển kinh tế - xã hội với tăng cường QP, AN trong lĩnh vực đối ngoại cần tập trung nội dung nào?","Trong lĩnh vực kinh tế đối ngoại phải đề cao cảnh giác khi lựa chọn đối tác đầu tư.","Trong liên kết đầu tư với nước ngoài cần chú ý quan tâm đến nhu cầu quốc phòng, an ninh.","Kết hợp trong việc phân bổ đầu tư vào ngành nào, địa bàn nào có lợi cho phát triển kinh tế, bảo đảm quốc phòng, an ninh của quốc gia.","Kết hợp trong xây dựng và quản lý các dự án, đặc biệt là dự án 100% vốn nước ngoài.",2],
["Để nâng cao hiệu lực quản lý Nhà nước của chính quyền các cấp trong kết hợp phát triển kinh tế xã hội với tăng cường củng cố QP, AN cần phải làm gì?","Xdựng và chỉ đạo thực hiện tốt các quy trình, phương pháp quản lý, điều hành của chính quyền các cấp.","Thường xuyên nắm vững chủ trương đường lối của Đảng kịp thời đề ra các nghị quyết lãnh đạo sát đúng.","Tổ chức tốt việc sơ kết, tổng kết rút kinh nghiệm kịp thời để bổ sung chủ trương và chỉ đạo thực hiện.","Từng cấp phải làm đúng chức năng, NV theo quy định của PL và nghị định 119/2004/NĐ-CP của Chính phủ.",3],
["Vai trò lãnh đạo của các cấp ủy Đảng trong việc kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh được thể hiện ở chỗ nào?","Từng cấp phải làm đúng chức năng, nhiệm vụ theo quy định của pháp luật và nghị định của Chính phủ.","Xây dựng và chỉ đạo thực hiện tốt các chỉ thị, nghị quyết của các cấp ủy Đảng.","Thường xuyên nắm vững chủ trương đường lối của Đảng, kịp thời đề ra các nghị quyết lãnh đạo ngành địa phương mình một cách đúng đắn.","Thường xuyên đôn đốc, kiểm tra việc thực hiện NQ và tổ chức tốt việc sơ kết, tổng kết rút kinh nghiệm.",2],
["Vai trò của kinh tế đối với QP, AN như thế nào?","Kinh tế quyết định sự lớn mạnh và phát triển của QP, AN.","Kinh tế quyết định đến sự tồn tại và phát triển lâu dài của QP, AN.","Kinh tế quyết định đến việc biên chế trang bị vũ khí, phương tiện cho quốc phòng, an ninh.","Kinh tế quyết định đến việc cung cấp số lượng, chất lượng nguồn nhân lực cho QP, AN.",3],
["Quốc phòng, an ninh tác động trở lại kinh tế như thế nào?","Hoạt động quốc phòng, an ninh tiêu tốn đáng kể một phần nguồn nhân lực, vật lực, tài chính của xã hội, là tiêu dùng “mất đi”.","Hoạt động quốc QP, AN còn ảnh hưởng đến đường lối phát triển kinh tế, cơ cấu kinh tế.","Hoạt động quốc phòng, an ninh còn có thể dẫn đến hủy hoại môi trường sinh thái, để lại hậu quả nặng nề cho kinh tế, nhất là khi chiến tranh xảy ra.","Cả ba nội dung trên.",3],
["Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong các ngành, các lĩnh vực kinh tế chủ yếu nào?","Kết hợp trong công nghiệp.","Kết hợp trong nông, lâm, ngư nghiệp.","Kết hợp trong giao thông vận tải, bưu điện, y tế, khoa học-công nghệ, giáo dục và xây dựng cơ bản.","Cả ba nội dung trên.",3],
["Giải pháp: Bồi dưỡng nâng cao kiến thức, kinh nghiệm kết hợp phát triển kinh tế-xã hội với tăng cường củng cố QP, AN cho các đối tượng, cần tập trung chú ý những giải pháp chủ yếu gì?","Đối tượng bồi dưỡng.","Nội dung bồi dưỡng.","Hình thức bồi dưỡng.","Cả ba giải pháp trên.",3],
["Nhiệm vụ của các nhà máy công nghiệp quốc phòng trong thời bình là gì?","Từng bước tự sản xuất vũ khí, trang bị, phương tiện đáp ứng nhu cầu của lực LL vũ trang.","Mở rộng liên doanh liên kết giữa các nhà máy công nghiệp Qphòng với công nghiệp các nước tiên tiến.","Ngoài việc sản xuất ra hàng quân sự phải tham gia sản xuất hàng dân sự chất lượng cao phục vụ tiêu dùng và XK.","Ngoài việc sản xuất vũ khí trang bị cho quân đội cần tham gia phát triển kinh tế, xã hội có hiệu quả cao.",2],
["Đối với vùng núi biên giới, việc kết hợp thực hiện phát triển kinh tế – xã hội với tăng cường củng cố quốc phòng, an ninh cần thực hiện nội dung nào?","Xây dựng phương án đối phó với các tình huống có thể xảy ra ở vùng biên giới.","Thực hiện tốt chương trình xóa đói giảm nghèo, chương trình 135 về phát triển kinh tế - xã hội đối với các xã nghèo.","Xây dựng quy hoạch, kế hoạch từng bước đưa dân định canh, định cư.","Xây dựng cơ chế chính sách tạo điều kiện phát triển kinh tế cửa khẩu.",1],
["Hoạt động kinh tế là quá trình hoạt động như thế nào?","Là quá trình lao động sản xuất ra của cải vật chất cho xã hội.","Là quá trình hoạt động sản xuất kinh doanh có hiệu quả.","Là quá trình tổ chức lao động, sản xuất một cách hợp lý.","Là quá trình hoạt động sản xuất và tái sản xuất ra của cải vật chất cho xã hội.",3],
["Để xây dựng QP, AN vững mạnh cần phải làm gì ?","Cần phải tăng cường ngân sách nhiều hơn cho QP, AN.","Cần phải trang bị chính quy hiện đại cho QP, AN.","Cần có chiến lược phát triển quốc phòng, an ninh.","Cần phải xây dựng, phát triển kinh tế.",3],
["Một trong những vấn đề lớn trong cương lĩnh 2011 về mục tiêu phát triển KT-XH 2011-2020 là gì?","Phấn đấu đến năm 2020 nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại","Phát triển kinh tế - xã hội gắn với phát triển quốc phòng, an ninh.","Đưa nước ta trở thành một nước công nghiệp hiện đại.","Hoàn thành thắng lợi các nhiệm vụ trong giai đoạn quá độ.",0],
["Kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh trong thực hiện nhiệm vụ chiến lược bảo vệ Tổ quốc có mấy nội dung?","3 nội dung","4 nội dung","5 nội dung","6 nội dung",1],
["Người Việt Nam muốn tồn tại, bảo vệ cuộc sống và nền văn hoá của mình chỉ có con đường duy nhất là gì?","Đánh đuổi đế quốc, bảo vệ Tổ quốc.","Đánh đuổi đế quốc thực dân, bảo vệ đất nước.","Đánh đuổi phong kiến thực dân, bảo vệ Tổ quốc.","Đoàn kết đứng lên đánh giặc, giữ nước.",3],
["Về tư tưởng chỉ đạo tác chiến trong nghệ thuật đánh giặc của ông cha ta là gì?","Kiên quyết không ngừng thế tiến công.","Kiên quyết phòng thủ bảo vệ đất nước.","Thực hiện tiến công liên tục mọi lúc, mọi nơi, từ cục bộ đến toàn bộ.","Thực hiện kết hợp tiến công và phòng thủ.",2],
["Một trong những nội dung dùng mưu đánh giặc trong nghệ thuật Qsự của ông cha ta là gì?","Lừa địch để đánh vào chỗ yếu, chỗ sơ hở, chỗ ít phòng bị, làm cho chúng bị động, lúng túng đối phó.","Lừa địch đánh vào chỗ yếu khi chúng sơ hở làm cho địch lúng túng đối phó.","Điều địch theo kế hoạch của ta, giành quyền chủ động.","Lấy số lượng ít, đánh với số lượng nhiều.",0],
["Một trong những nội dung dùng kế đánh giặc trong nghệ thuật Qsự của ông cha ta là gì?","Để điều địch theo ý định của ta, giành quyền chủ động buộc chúng phải đánh theo cách của ta.","Lừa địch đánh vào chỗ yếu làm cho địch lúng túng đối phó.","Lừa địch để đánh vào chỗ yếu, chỗ sơ hở, chỗ ít phòng bị","Lừa địch làm cho chúng bị động, lúng túng đối phó.",0],
["Nội dung của nghệ thuật quân sự Việt Nam từ khi có Đảng lãnh đạo là gì?","Chiến lược quân sự","Nghệ thuật chiến dịch.","Chiến thuật.","Cả ba yếu tố trên.",3],

["Hoạt động tác chiến của LL vũ trang trong Nghệ thuật quân sự toàn dân đánh giặc là gì?","Kết hợp đánh phân tán, tập trung với bao vây chia cắt .","Kết hợp đánh nhỏ, đánh vừa với tập trung.","Kết hợp đánh vừa, đánh lớn với bao vây.","Kết hợp đánh phân tán, tập trung, kết hợp đánh nhỏ, đánh vừa, đánh lớn.",3],
["Một trong những bài học kinh nghiệm về nghệ thuật quân sự vào sự nghiệp bảo vệ Tổ quốc thời kỳ mới đó là gì?","Mưu kế đánh giặc, mềm dẻo trong chiến đấu kết hợp tiến công với binh vận.","Thực hiện toàn dân, đánh giặc tập trung lực lượng xây dựng tuyến phòng thủ vững chắc.","Tư tưởng chiến đấu của nhân dân biết mở đầu và kết thúc chiến tranh đúng lúc.","Quán triệt tư tưởng lấy ít đánh nhiều, biết tập trung ưu thế lực lượng cần thiết để đánh thắng địch.",3],
["Bài học kinh nghiệm thứ năm về nghệ thuật quân sự vào sự nghiệp bảo vệ Tổ quốc thời kỳ mới là nội dung nào dưới đây ?","Kết hợp tiêu hao, tiêu diệt địch với bảo vệ vững chắc các mục tiêu.","Quán triệt tư tưởng lấy ít địch nhiều kết hợp với tiến công liên tục.","Nghệ thuật toàn quân đánh giặc kết hợp với đánh lớn đánh vừa.","Nghệ thuật dùng sức mạnh tổng hợp các thành phần lực lượng với bao vây chia cắt.",0],
["Bài học kinh nghiệm thứ nhất về nghệ thuật quân sự vào sự nghiệp bảo vệ Tổ quốc thời kỳ mới là gì?","Quán triệt tư tưởng tích cực tiến công.","Kết hợp tiêu hao tiêu diệt với bảo vệ vững chắc các mục tiêu đảm nhiệm.","Nghệ thuật quân sự toàn dân đánh giặc cả nước là một chiến trường.","Nghệ thuật tạo sức mạnh tổng hợp bằng lực, thế, thời và mưu kế.",0],
["Kế sách đánh giặc của ông cha ta là gì?","Tập trung lực lượng xây dựng tuyến phòng thủ vững chắc.","Đánh nhanh thắng nhanh, nhanh chóng tiêu hao tiêu diệt địch ngay từ đầu.","Mềm dẻo với khôn khéo, kết hợp tiến công quân sự với binh vận, ngoại giao, tạo thế mạnh của ta, phá thế mạnh của địch.","Né tránh thế mạnh của địch, quân chủ lực kết hợp với quân địa phương tiến hành CT.",2],
["Nghiên cứu nghệ thuật của các thế hệ ông cha ta, chúng ta có cảm nghĩ gì?","Có quyền tự hào về tinh thần dũng cảm, ý chí kiên cường trong chống giặc ngoại xâm để bảo vệ non sông đất nước.","Tự hào về tinh thần chiến đấu của nhân dân và sẵn sàng tuyên chiến với mọi quân đội, mọi quốc gia.","Tin vào sự bất khả xâm phạm của đất nước ta, không sợ một quốc gia nào.","Tự hào truyền thống chiến đấu kiên cường,bền bỉ, sự chịu đựng nhẫn nhịn của ông cha ta.",0],
["Nghiên cứu nghệ thuật quân sự, rút ra các bài học kinh nghiệm về nghệ thuật quân sự trong sự nghiệp bảo vệ Tổ quốc thời kỳ mới, một trong những trách nhiệm của sinh viên là gì?","Tự hào về lịch sử của đất nước ta và yên tâm học tập công tác không lo có kẻ thù xâm lược.","Yên tâm học tập công tác không phải lo công việc bảo vệ Tổ quốc vì không có kẻ thù xâm lược.","Phải phấn đấu, tu dưỡng để trở thành những công dân tốt, sẵn sàng làm nhiệm vụ khi Tổ quốc cần.","Yên tâm học tập công tác vì đã có lực lượng quân đội hùng mạnh chiến thắng mọi kẻ thù.",2],
["Nghiên cứu nghệ thuật quân sự Việt Nam, rút ra các bài học kinh nghiệm về nghệ thuật quân sự trong sự nghiệp bảo vệ Tquốc thời kỳ mới, một trong những trách nhiệm của sinh viên là gì?","Phát huy tinh thần tự lực, vượt qua khó khăn để hoàn thành nhiệm vụ học tập, đặc biệt là không ngừng bồi đắp lòng yêu quê hương đất nước.","Phát huy tinh thần tự giác,cố gắng học tập và rèn luyện.","Phát huy tính độc lập, tự lực, tự cường để học tập và công tác.","Phát huy tính tự chủ, tự cường, tham gia tốt các hoạt động xã hội.",0],
["Ông cha ta kết hợp đấu tranh giữa các mặt trận quân sự, chính trị, ngoại giao, binh vận nhằm mục đích gì?","Nhằm tổ chức lực lượng lớn hơn địch để thắng chúng.","Nhằm tạo ra sức mạnh tổng hợp, giành thắng lợi trong chiến tranh.","Nhằm phát huy sức mạnh của từng yếu tố.","Có lực lượng lớn hơn địch để thắng chúng.",1],
["Trong nội dung đánh giặc của tổ tiên, mặt trận ngoại giao có vị trí quan trọng như thế nào?","Là mặt quan trọng, kết hợp với tiến công địch toàn diện.","Là mặt trận có vị trí rất quan trọng, đề cao tính chính nghĩa của nhân dân ta, phân hóa, cô lập kẻ thù, tạo thế có lợi cho cuộc chiến, kết hợp với mặt trận quân sự, chính trị tạo thế có lợi để kết thúc chiến tranh càng sớm càng tốt.","Là mặt trận giữ vững quyền chủ động, tạo điều kiện cho quân sự.","Là mặt trận động viên tinh thần chiến đấu, là cơ sở cho mặt trận quân sự.",1],
["Trong nghệ thuật đánh giặc của ông cha ta, vị trí của mặt trận chính trị được xác định như thế nào?","Mặt trận cổ vũ tinh thần yêu nước của nhân dân, quy tụ sức mạnh đại đoàn kết dân tộc, là cơ sở để tạo ra sức mạnh quân sự.","Là cơ sở tạo sức mạnh quân sự, ngoại giao, binh vận.","Cùng với quân sự quyết định sức mạnh của chiến trường.","Là cơ sở tạo sức mạnh quân sự, ngoại giao.",0],
["Trong nội dung nghệ thuật quân sự của ông cha ta, vị trí của mặt trận quân sự được xác định như thế nào?","Quyết định thắng lợi trực tiếp của chiến tranh.","Là mặt trận cơ bản chi phối các mặt trận khác.","Là mặt trận xung kích cổ vũ tinh thần yêu nước.","Có tính quyết định làm thay đổi mối quan hệ đối ngoại giữa các quốc gia trong chiến tranh.",0],

["Để bảo vệ đất nước, bảo vệ sự trường tồn của dân tộc, ông cha ta đã làm gì?","Đoàn kết và phát huy tối đa ưu thế của địa hình để lập thế trận đánh giặc.","Đoàn kết và phát huy tốt thế trận địa hình để đánh giặc bảo vệ Tổ quốc.","Xây dựng thế trận phòng thủ đánh giặc giữ nước.","Xây dựng thế trận khu vực phòng thủ bảo vệ Tổ quốc.",0],

["Ý nghĩa của việc phòng ngừa tội phạm?","Có ý nghĩa chính trị xã hội to lớn, nhằm giữ vững trật tự an toàn xã hội, bảo vệ tài sản của xã hội, danh dự, phẩm giá của mọi người dân.","Có ý nghĩa chính trị xã hội sâu sắc, giúp giữ vững an ninh quốc gia, trật tự an toàn xã hội, bảo vệ tài sản của xã hội, tính mạng, sức khoẻ, danh dự, phẩm giá của mọi người dân.","Có ý nghĩa chính trị sâu sắc, giữ vững an ninh quốc gia, bảo vệ tài sản của xã hội, tính mạng, sức khoẻ, danh dự, phẩm giá của mọi người dân và xã hội.","Có ý nghĩa sâu sắc, ngăn ngừa giúp giữ vững an ninh chính trị, trật tự an toàn xã hội, bảo vệ tài sản, tính mạng, danh dự, phẩm giá của mọi người dân.",1],

["Trách nhiệm của Tòa án các cấp trong phòng, chống tội phạm?",tt+"những vấn đề của tội phạm để các ngành, các cấp kịp thời có biện pháp ngăn chặn, loại trừ.",tt+"tội phạm để Chính phủ, các ngành, các cấp kịp thời có biện pháp phòng, chống, loại trừ.",tt+"những nguyên nhân, điều kiện của tội phạm để Chính phủ, các ngành, các cấp kịp thời có biện pháp ngăn chặn, loại trừ.","Thông qua xét xử đảm bảo công minh, chính xác, đúng pháp luật; tìm ra những nguyên nhân, điều kiện của tội phạm để Chính phủ, các ngành, các cấp kịp thời có biện pháp ngăn chặn, loại trừ.",2],
["Trách nhiệm của Bộ Tư pháp trong phòng, chống tội phạm?","Chủ động xây dựng và hoàn thiện hệ thống pháp luật có liên quan đến công tác phòng chống tội phạm, khắc phục những sơ hở thiếu sót là nguyên nhân, điều kiện của tội phạm.","Tham gia xây dựng và hoàn thiện hệ thống pháp luật có liên quan đến công tác đấu tranh, phòng chống tội phạm, khắc phục những sơ hở thiếu sót là nguyên nhân, điều kiện của tội phạm.","Tham gia xây dựng và hoàn thiện các văn bản pháp luật có liên quan đến đấu tranh, phòng chống tội phạm, kịp thời khắc phục những sơ hở thiếu sót là nguyên nhân, điều kiện của tội phạm.","Tham gia xây dựng và hoàn thiện hệ thống pháp luật trong hoạt động đấu tranh, phòng chống tội phạm, khắc phục những sơ hở thiếu sót là nguyên nhân, điều kiện của tội phạm.",1],
["Trách nhiệm của công dân trong phòng, chống tội phạm?","Thực hiện nghiêm quyền, nghĩa vụ của công dân đã được quy định trong Hiến pháp, chủ động tham gia hoạt động phòng ngừa tội phạm.",th("tốt","tích cực"),"Thực hiện có hiệu quả các quyền, nghĩa vụ của công dân đã được quy định trong Hiến pháp, tích cực tham gia đấu tranh phòng ngừa tội phạm.","Thực hiện tốt các quyền, nghĩa vụ của công dân đã được quy định trong Hiến pháp, tích cực tham gia hoạt động phòng ngừa tội phạm.",3],
["Có mấy nguyên tắc tổ chức hoạt động phòng, chống tội phạm?","Có 6 nguyên tắc.","Có 5 nguyên tắc.","Có 7 nguyên tắc.","Có 4 nguyên tắc.",0],
["Nguyên tắc pháp chế trong phòng, chống tội phạm?",mp+"phù hợp với pháp luật.",mp+"hợp hiến và hợp pháp.","Mọi hoạt động đấu tranh phòng ngừa tội phạm của các cơ quan, tổ chức, các công dân phải phù hợp với hiến pháp.","Hoạt động phòng ngừa tội phạm của các cơ quan chức năng, tổ chức xã hội, các công dân phải hợp hiến và hợp pháp.",1],
["Nguyên tắc dân chủ xã hội chủ nghĩa trong phòng, chống tội phạm?","Mọi cơ quan, tổ chức chính trị đều có thể tham gia công tác phòng ngừa tội phạm và nhà nước tạo mọi điều kiện cho các chủ thể tham gia hoạtt động phòng ngừa tội phạm.","Mọi tổ chức, công dân đều có thể tham gia các hoạt động phòng ngừa tội phạm và nhà nước tạo mọi điều kiện cho các chủ thể tham gia đấu tranh phòng ngừa tội phạm.","Mọi cơ quan, tổ chức, công dân đều có thể tham gia hoạtt động phòng ngừa tội phạm và nhà nước tạo mọi điều kiện cho các chủ thể tham gia hoạtt động phòng ngừa tội phạm.","Mọi công dân đều có thể tham gia hoạt động phòng ngừa tội phạm và nhà nước tạo mọi điều kiện cho các tổ chức, cá nhân tham gia hoạt động phòng ngừa tội phạm.",2],
["Nguyên tắc nhân đạo trong phòng, chống tội phạm?",nd("không được hạ thấp danh dự con người mà phải nhằm khôi phục con người và tạo điều kiện để con người nhận thức ra lỗi lầm của mình.").replace("Các biện pháp phòng ngừa tội phạm không","Các biện pháp phòng ngừa, ngăn chặn tội phạm không"),nd("tuyệt đối không được hạ thấp lòng tự trọng, nhân phẩm con người mà phải nhằm giáo dục con người."),nd("không được hạ thấp danh dự mà phải cảm hóa, giáo dục con người và tạo điều kiện để con người phát triển."),nd("không được hạ thấp danh dự nhân phẩm con người mà phải nhằm khôi phục con người và tạo điều kiện để con người phát triển."),3],
["Nội dung hoạt động phòng, chống tội phạm xâm phạm danh dự, nhân phẩm?",dd+"thể chế, chính sách kinh tế, xã hội góp phần nâng cao chất lượng, hiệu quả phòng, chống tội phạm.",dd+"hệ thống pháp luật và các chính sách kinh tế, xã hội góp phần bảo đảm an sinh xã hội, nâng cao hiệu quả phòng, chống tội phạm.",dd+"thể chế, chính sách kinh tế, xã hội góp phần bảo đảm an sinh xã hội, nâng cao hiệu quả phòng, chống tội phạm.",dd+"thể chế, chính sách kinh tế, xã hội, văn hóa góp phần bảo đảm đời sống xã hội, nâng cao hiệu quả phòng, chống tội phạm.",2],
["Nội dung nâng cao chất lượng, hiệu quả phong trào toàn dân bảo vệ an ninh Tổ quốc?",tx+"đổi mới nội dung, hình thức, phương pháp tuyên truyền, nâng cao nhận thức, trách nhiệm của nhân dân về phòng, chống tội phạm.",tx+"đổi mới hình thức, phương pháp giáo dục nâng cao nhận thức, trách nhiệm cho nhân dân về nhiệm vụ phòng, chống tội phạm.",tx+"đổi mới phương pháp tuyên truyền, giáo dục nâng cao nhận thức trách nhiệm của nhân dân về phòng, chống tội phạm.",tx+"cải tiến hình thức, phương pháp tuyên truyền, giáo dục nâng cao nhận thức trách nhiệm của nhân dân về phòng, chống tội phạm.",3],
["Nội dung quản lý, giáo dục cải tạo và tái hòa nhập cộng đồng đối với người phạm tội, vi phạm pháp luật và đối tượng có nguy cơ phạm tội?",nc+"chất lượng, hiệu quả công tác giam giữ, quản lý, giáo dục cải tạo các loại đối tượng.",nc+"chất lượng, hiệu quả hoạt động giam giữ, quản lý, giáo dục cải tạo các loại đối tượng.",nc+"hiệu quả công tác giam giữ, quản lý, giáo dục cải tạo các loại tội phạm.",nc+"chất lượng, hiệu quả công tác quản lý, giáo dục cải tạo các loại tội phạm.",0],
["Nội dung đẩy mạnh hoạt động phòng ngừa nghiệp vụ?",nc+"chất lượng, hiệu quả thực hiện các nội dung công tác nghiệp vụ, đổi mới phương pháp công tác nắm tình hình, thống kê tội phạm.",nc+"chất lượng, hiệu quả thực hiện các biện pháp công tác nghiệp vụ, đổi mới phương pháp công tác nắm tình hình, thống kê tội phạm.",nc+"hiệu quả thực hiện các biện pháp công tác nghiệp vụ, đổi mới nội dung công tác nắm tình hình, thống kê tội phạm.",nc+"chất lượng, hiệu quả thực hiện các biện pháp công tác nghiệp vụ, đẩy mạnh công tác nắm tình hình, thống kê tội phạm.",1],
["Nội dung tổ chức tiến hành các hoạt động phát hiện, điều tra, xử lý tội phạm?","Xây dựng, triển khai các chương trình, kế hoạch chuyên đề đấu tranh phòng, chống với các loại tội phạm nổi lên ở từng giai đoạn.","Xây dựng, triển khai các nội dung chương trình, kế hoạch chuyên đề đấu tranh với các loại tội phạm nổi lên ở từng giai đoạn.","Xây dựng, triển khai các chương trình, kế hoạch chuyên đề đấu tranh với các loại tội phạm nổi lên ở từng giai đoạn.","Xây dựng, triển khai các kế hoạch chuyên đề đấu tranh với các loại tội phạm nguy hiểm nổi lên ở từng giai đoạn.",2],
["Biện pháp phòng ngừa chung được hiểu như thế nào?","Là tổng hợp tất cả các biện pháp quản lý về chính trị, kinh tế, văn hoá, pháp luật, giáo dục.","Là tổng hợp tất cả các biện pháp về chính trị, kinh tế, văn hoá, ngoại giao, pháp luật, giáo dục.","Là tổng hợp những vấn đề về chính trị, kinh tế, văn hoá, ngoại giao, pháp luật, giáo dục.","Là tổng hợp tất cả các biện pháp về chính trị, kinh tế, văn hoá, pháp luật, giáo dục.",3],
["Biện pháp phòng, chống riêng được hiểu như thế nào?",pg+" đóng vai trò nòng cốt, xung kích.",pg+", bộ đội biên phòng đóng vai trò nòng cốt, xung kích.","Là việc vận dụng dụng các hình thức mang tính đặc trưng, chuyên môn của từng ngành, từng lực lượng, trong đó có hoạt động của cơ quan công an đóng vai trò nòng cốt, xung kích.","Là việc áp dụng các phương pháp mang tính đặc trưng, chuyên môn của từng ngành, từng lực lượng, trong đó có hoạt động của cơ quan công an, cảnh sát biển đóng vai trò nòng cốt, xung kích.",0],
["Có mấy biện pháp phòng, chống tội phạm?","Có 6 biện pháp.","Có 4 biện pháp.","Có 5 biện pháp.","Có 6 biện pháp.",1],
["Theo nội dung tác động của phòng ngừa tội phạm có mấy biện pháp?","Biện pháp kinh tế, biện pháp giáo dục, biện pháp tổ chức, biện pháp thông tin, biện pháp pháp luật.","Biện pháp kinh tế, biện pháp giáo dục, tuyên truyền, biện pháp tổ chức, biện pháp pháp luật.","Biện pháp kinh tế, biện pháp giáo dục, biện pháp tổ chức, biện pháp pháp luật.","Biện pháp chính trị, biện pháp kinh tế, biện pháp giáo dục, biện pháp tổ chức, biện pháp pháp luật.",2],
["Theo phạm vi, quy mô tác động của các biện pháp phòng chống tội phạm?","Có các biện pháp trong nhiều tỉnh, nhiều thành phố, trên phạm vi cả quốc gia.","Có các biện pháp trong một huyện, một tỉnh, một thành phố và trên phạm vi cả quốc gia.","Có các biện pháp trong nhiều tỉnh, thành phố, trong một khu vực vùng và trên phạm vi cả quốc gia.","Có các biện pháp trong một tỉnh, một thành phố, trên phạm vi cả quốc gia.",3],
["Trách nhiệm của nhà trường trong phòng chống tội phạm?","Xây dựng nhà trường văn hóa, văn minh, trong sạch, lành mạnh không có các hiện tượng tiêu cực và các tệ nạn xã hội.","Xây dựng nhà trường có môi trường văn hóa trong sạch, lành mạnh không có các hiện tượng tiêu cực và các tệ nạn xã hội.","Xây dựng nhà trường trong sạch, lành mạnh không có các hiện tượng tiêu cực, các tội phạm và các tệ nạn xã hội.","Xây dựng nhà trường văn minh, lành mạnh không có các hiện tượng tiêu cực và các tệ nạn xã hội.",1],
["Nghị quyết số 36-NQ/TW ngày 01/7/2014 của Bộ Chính trị về đẩy mạnh ứng dụng, phát triển công nghệ thông tin, đáp ứng yêu cầu phát triển bền vững và hội nhập quốc tế đã chỉ rõ những vấn đề gì?","Phải gắn kết chặt chẽ việc ứng dụng, phát triển công nghệ thông tin phải đi đôi với bảo đảm an toàn, an ninh và bảo mật hệ thống thông tin và cơ sở dữ liệu quốc gia”.","Phải gắn kết chặt chẽ việc ứng dụng, phát triển khoa học công nghệ phải đi đôi với bảo đảm an toàn, an ninh”.","Phải gắn kết chặt chẽ việc ứng dụng các thành tựu khoa học phải bảo đảm an toàn, an ninh và bảo mật hệ thống thông tin và cơ sở dữ liệu quốc gia”.","Phát triển công nghệ thông tin phải đi đôi với bảo đảm an toàn, an ninh hệ thống thông tin và cơ sở dữ liệu quốc gia”.",0],

Q.push(["Khái niệm vũ khí công nghệ cao?","Là vũ khí thông thường được thiết kế, chế tạo dựa trên những thành tựu của cuộc cách mạng khoa học và công nghệ hiện đại, có tính năng kỹ, chiến thuật cao.","Là vũ khí hạt nhân được nghiên cứu, thiết kế, chế tạo do khoa học kỹ thuật và công nghệ phát triển hiện đại, có tính năng kỹ, chiến thuật cao.","Là vũ khí được nghiên cứu, thiết kế, chế tạo dựa trên những thành tựu của cuộc cách mạng khoa học kỹ thuật và công nghệ hiện đại, có sự nhảy vọt về chất lượng và tính năng kỹ chiến thuật.","Vũ khí công nghệ cao (Vũ khi thông minh, vũ khi tinh khôn) là vũ khí được nghiên cứu, thiết kế, chế tạo dựa trên những thành tựu của cuộc cách mạng khoa học và công nghệ hiện đại, có sự nhảy vọt về chất lượng và tính năng kĩ thuật, chiến thuật.",3]);
Q.push(["Đặc điểm nổi bật của vũ khí công nghệ cao là gì?","Có tính năng kỹ thuật vượt trội hơn hẳn vũ khí thông thường về tầm bắn, uy lực sát thương lớn, độ chính xác cao.","Hiệu suất của vũ khí, phương tiện tăng gấp nhiều lần so với vũ khí, phương tiện thông thường.","Có hiệu suất vũ khí, phương tiện tăng gấp nhiều lần so với vũ khí thông thường.","Có khả năng tự động hóa cao, hàm lượng tri thức lớn, tính cạnh tranh cao, được nâng cấp liên tục.",1]);

Q.push(["Nếu có chiến tranh xẩy ra trên nước ta, có thể xuất phát từ nhiều hướng, là những hướng nào?","Trên bộ, trên không, từ biển vào, có thể diễn ra ở cùng 1 lúc ở chính diện và trong chiều sâu phạm vi toàn quốc.","Trên vùng biên giới, hải đảo, đất liền, có thể diễn ra hàng loạt cùng 1 lúc ở các vùng, miền của toàn quốc.","Trên không, trên biển; từ các vùng biên giới, có thể diễn ra theo chiều rộng và chiều sâu trên phạm vi toàn quốc.","Trên cùng 1 lúc theo hướng biên giới, hải đảo, trên không, trên biển vào, có thể diễn ra nhanh chóng trên phạm vi toàn quốc.",0]);

Q.push(["Trong tiến công hỏa lực bằng vũ khí công nghệ cao là phương thức tiến hành chiến tranh kiểu nào của địch?","Kiểu cũ đồng thời là biện pháp kỹ thuật của địch.","Kiểu mới đồng thời là biện pháp tác chiến của địch.","Kiểu hiện đại đồng thời là biện pháp linh hoạt của địch.","Kiểu cũ và mới đồng thời là biện pháp chiến thuật của địch.",1]);

Q.push(["Để phòng chống trinh sát của địch, ta đã cần sử dụng những phương pháp nào đối phó?","Làm hạn chế đặc trưng của mục tiêu, che dấu mục tiêu, ngụy trang mục tiêu, tổ chức tốt việc nghi binh đánh lừa địch.","Tạo giả các mục tiêu, cất dấu các mục tiêu, chùm che kín mục tiêu, đánh lừa địch bằng các mục tiêu giả.","Ngụy trang phủ kín mục tiêu, sơn mục tiêu theo màu tự nhiên, tổ chức nghi binh đánh lừa địch.","Lợi dụng môi trường tự nhiên như môi trường, cây cỏ, để che giấu mục tiêu tạo, hiện trường giả để đánh lừa địch.",0]);
Q.push(["Để làm hạn chế đặc trưng của mục tiêu, cần sử dụng các biện pháp kỹ thuật nào?","Sử dụng các biện pháp phủ bạt, che đậy cây lá như mầu thiên nhiên để làm hạn chế đặc trưng của mục tiêu.","Sử dụng các biện pháp làm giảm đặc trưng ánh sáng, âm thanh, điện từ, bức xạ hồng ngoại.","Sử dụng các thủ đoạn chiến thuật, kĩ thuật giảm thiểu đặc trưng vật lí của mục tiêu,","Sử dụng các biện pháp sơn, phủ bạt, che đậy lá cây vào mục tiêu như màu thiên nhiên để hạn chế đặc trưng mục tiêu.",2]);
Q.push(["Thế nào là biện pháp che giấu mục tiêu tốt nhất?","Lợi dụng môi trường tự nhiên như địa hình, địa vật, rừng cây, bụi cỏ.","Lợi dụng các biện pháp kỹ thuật làm giảm bớt ánh sáng, âm thanh, điện từ.","Lợi dụng đêm tối, sương mù, màn mưa để che giấu âm thanh, ánh sáng, nhiệt.","Lợi dụng các biện pháp sơn, phủ bạt, đậy lá cây vào mục tiêu như màu thiên nhiên.",0]);
Q.push(["Thế nào là biện pháp ngụy trang tốt nhất?","Sử dụng các biện pháp ngụy trang để làm hạn chế đặc trưng của mục tiêu.","Sử dụng các khí tài ngụy trang như màn khói, lưới ngụy trang, nghi binh, nghi trang.","Sử dụng các biện pháp truyền thống để thay đổi hình dáng mục tiêu.","Sử dụng các biện pháp che đậy bằng lá cây, phủ bạt màu thiên nhiên.",2]);
Q.push(["Thế nào là nghi binh đánh lừa địch?","Nghi binh là hành động lừa địch vào nơi ta cần đánh.","Nghi binh là hành động gây rối để địch trở tay không kịp.","Nghi binh là hành động tạo hiện tượng giả để đánh lừa đối phương.","Nghi binh là hành động làm địch nhận định sai dẫn đến sai lầm.",2]);

Q.push(["Khi cơ động phòng tránh, đánh trả cần phải thực hiện các yếu tố gì?","Phải bất ngờ, tiếp cận nhanh, đến đúng vị trí, thời gian sẵn sàng chiến đấu nhanh.","Phải bí mật, cơ động nhanh, đến đúng địa điểm, thời gian sẵn sàng chiến đấu cao.","Phải bất ngờ, phát hiện địch từ xa, đi đúng hướng, thời gian chiến đấu nhanh.","Phải bí mật, phát hiện địch nhanh, đến đúng vị trí, thời gian chiến đấu cao.",1]);
Q.push(["Để phòng chống địch bằng vũ khí công nghệ cao có hiệu quả, cần phải đòi hỏi vấn đề gì quan trọng?","Phải có sự tham gia của toàn Đảng, toàn quân, toàn dân, của cả hệ thống chính trị trên tất cả các lĩnh vực từ nhận thức đến hành động.","Phải có lòng yêu nước, yêu chủ nghĩa xã hội, dũng cảm, mưu trí, sáng tạo, sẵn sàng chiến đấu hy sinh vì Tổ quốc.","Phải có sự phát triển của nền khoa học công nghệ hiện đại, phát triển công nghiệp hóa- hiện đại hóa đất nước.","Phải có tinh thần đoàn kết dân tộc, yêu nước, yêu chủ nghĩa xã hội; không sợ hy sinh, gian khổ để vượt qua mọi khó khăn thử thách.",0]);
Q.push(["Trong tương lai, nếu cuộc chiến tranh xẩy ra là cuộc chiến tranh sử dụng vũ khí công nghệ cao, nó sẽ diễn ra như thế nào?","Diễn ra trên cả chiều sâu và chiều rộng, không phân định hậu phương và tiền tuyến.","Diễn ra trên cả miền Bắc, miền Trung, miền Nam; không phân định rõ ràng mọi miền của đất nước.","Diễn ra trên không gian nhiều chiều, tiền tuyến và hậu phương không phân định rõ ràng như trước đây.","Diễn ra đồng thời một lúc ở mọi miền của đất nước, không phân định rõ ràng.",2]);

Q.push(["Với điều kiện và khả năng của ta hiện nay, việc tổ chức đánh trả vũ khí công nghệ cao của địch cần như thế nào?","Phải có trọng tâm, trọng điểm, luôn cơ động chính xác. Đánh trả địch bằng sức mạnh tổng hợp trong nhân dân.","Phải đúng đối tượng, đúng thời cơ, đánh trả thường xuyên liên tục, thực hiện đánh rộng khắp từ xa đến gần, các độ cao và hướng khác nhau.","Phát huy sức mạnh tổng hợp của các lực lượng trong mọi tầng lớp xã hội, phải đánh trả thường xuyên, liên tục, thực hiện đánh rộng khắp từ xa đến gần.","Phải có trọng điểm, đúng đối tượng, đúng thời cơ. Đánh trả địch bằng mọi lực lượng, mọi loại vũ khí, trang bị, thực hiện đánh rộng khắp, từ xa đến gần, các độ cao, các hướng khác nhau.",3]);
Q.push(["Khi địch sử dụng vũ khí công nghệ cao, về phương pháp phòng tránh đánh trả của ta như thế nào?","Phải kết hợp chặt chẽ giữa đánh địch với cơ động, ngụy trang, nghi binh, phòng tránh bảo tồn lực lượng.","Phải kết hợp chặt chẽ giữa đánh địch ban ngày, ban đêm, cơ động nhanh, bảo đảm kịp thời, chính xác.","Phải kết hợp và bố trí lực lượng phân tán, nhưng hỏa lực phải tập trung; kết hợp chặt chẽ giữa ngụy trang che giấu và hoạt động nghi binh.","Phải kết hợp chặt chẽ và triệt để tận dụng ưu thế địa hình tự nhiên, để cải tạo và xây dựng công trình phòng tránh theo một ý định chiến lược.",0]);
Q.push(["Muốn làm tốt công tác phòng tránh trinh sát của địch, cần phải làm gì?","Xác định tư tưởng, tinh thần tốt, sau đó mới áp dụng các biện pháp, phương pháp đối phó cho phù hợp.","Xác định rõ ý thức phòng chống trinh sát, sau đó mới áp dụng các biện pháp, phương pháp đối phó cho phù hợp.","Xác định rõ các biện pháp đối phó phù hợp, sau đó áp dụng các biện pháp kỹ thuật mới hiện đại.","Xác định rõ các biện pháp để khả năng trinh sát của địch không hiệu quả, bảo đảm an toàn cho ta.",1]);
Q.push(["Qua khảo sát thực tế, một số loại tên lửa hành trình được sử dụng trong chiến tranh I Rắc có nhược điểm gì?","Kích thước lớn, dễ phát hiện khi bay, tốc độ bay chậm.","Tầm bay thấp, kích thước lớn, hướng bay thường theo quy luật.","To nặng cồng kềnh, dễ nhìn thấy khi bay, tầm bay thấp.","Tầm bay thấp, tốc độ bay chậm, hướng bay theo quy luật.",3]);
Q.push(["Cần hiểu đúng về vũ khí công nghệ cao như thế nào?","Không quá lo sợ dẫn đến bi quan, dao động, không giám chống trả. Cũng không nên đơn giản coi thường vũ khí công nghệ cao.","Không quá đề cao, tuyệt đối hóa vũ khí công nghệ cao dẫn đến tâm lý hoang mang khi đối mặt. Ngược lại, cũng không nên coi thường dẫn đến chủ quan, mất cảnh giác.","Không cường điệu vũ khí công nghệ cao nhằm thần thánh, tạo tâm lý hoang mang lo sợ. Ngược lại, không chủ quan đơn giản dẫn đến lơ là, mất cảnh giác.","Không đáng sợ, vì đã có kinh nghiệm phòng chống đánh trả vũ khí công nghệ cao trong kháng chiến chống Mĩ cứu nước của nhân dân ta.",1]);

$("my").onclick=()=>{$("md").classList.add("hide");const f=act||submit;act=null;f()};
function submit(){
 const n=Q.length;let c=0;Q.forEach((q,i)=>{if(ans[i]!==undefined&&q.o[ans[i]].ok)c++});
 const p=Math.round(c/n*1000)/10;
 $("sm").textContent=`Bạn đã đúng ${c}/${n} câu (${p}%).`;
 $("st").textContent=n;$("sc").textContent=c;$("sw").textContent=n-c;$("sp").textContent=`${c} / ${n}`;
 $("quiz").classList.add("hide");$("res").classList.remove("hide");filt="all";review();scrollTo(0,0);
}
function review(){
 document.querySelectorAll("#fl button").forEach(b=>b.classList.toggle("on",b.dataset.f===filt));
 const box=$("rv");box.innerHTML="";
 Q.forEach((q,i)=>{const u=ans[i],ok=u!==undefined&&q.o[u].ok;
  if(filt==="ok"&&!ok||filt==="no"&&ok)return;
  const ci=q.o.findIndex(o=>o.ok),d=document.createElement("div");d.className="card rv "+(ok?"ok":"no");
  const h=document.createElement("div");h.innerHTML=`<span class="tag ${ok?"ok":"no"}">${ok?"Đúng":"Sai"}</span> <span class="mu">Câu ${i+1}</span>`;
  const t=document.createElement("div");t.className="q";t.textContent=q.q;d.append(h,t);
  const a=document.createElement("div");a.className="ans "+(ok?"c":"w");
  a.textContent=u===undefined?"Bạn chưa trả lời":`Đáp án của bạn: ${L[u]}. ${q.o[u].t}`;d.appendChild(a);
  if(!ok){const c=document.createElement("div");c.className="ans c";c.textContent=`Đáp án đúng: ${L[ci]}. ${q.o[ci].t}`;d.appendChild(c)}
  box.appendChild(d)});
 if(!box.children.length)box.innerHTML='<div class="card mu">Không có câu hỏi nào.</div>';
}
$("fl").onclick=e=>{if(e.target.dataset.f){filt=e.target.dataset.f;review()}};
$("rt").onclick=()=>build(true);
let de=1,half=1;
const go=()=>{set=(de-1)*2+half;
 document.querySelectorAll("#dets button").forEach(b=>b.classList.toggle("on",+b.dataset.d===de));
 document.querySelectorAll("#sets button").forEach(b=>b.classList.toggle("on",+b.dataset.s===half));build(false)};
$("dets").onclick=e=>{const d=e.target.dataset.d;if(!d)return;de=+d;go()};
$("sets").onclick=e=>{const k=e.target.dataset.s;if(!k)return;half=+k;go()};
const ask=(rand)=>{
 if(Object.keys(ans).length&&!$("quiz").classList.contains("hide")){act=()=>build(rand);
  $("mt").textContent="Thao tác này sẽ xóa các câu đã trả lời trong đề hiện tại. Tiếp tục?";$("my").textContent="Tiếp tục";$("md").classList.remove("hide")}
 else build(rand)};
$("shf").onclick=()=>ask(true);$("ord").onclick=()=>ask(false);
build(false);
</script></body></html>
